#version: "3.8"

services:
  agendador-tarefas:
    build: ../agendador-tarefas
    container_name: agendador-tarefas
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/db_agendador
      - USUARIO_URL=usuario:8080
    depends_on:
      - mongo


  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-tarefas
    restart: always
    ports:
      - "8083:8083"
    environment:
      - USUARIO_URL=usuario:8080/usuario
      - TAREFAS_URL=agendador-tarefas:8081/tarefas
      - NITIFICACAO_URL=notificacao:8082/email


  usuario:
    build: ../usuario
    container_name: usuario
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_usuario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - postgres


  notificacao:
    build: ../notificacao
    container_name: notificacao
    restart: always
    ports:
      - "8082:8082"


  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: db_usuario
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql


  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: db_agendador



volumes:
  pgdata:
    driver: local

networks:
  default:
    driver: bridge